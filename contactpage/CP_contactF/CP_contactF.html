  <div class="row center-form-row">

<!-- Form Handling JavaScript -->
<script>
  (function() {
    const form = document.getElementById("contactForm");
    const statusBox = document.getElementById("formStatus");
    const sendBtn = document.getElementById("sendBtn");

    if (!form) return;

    async function handleSubmit(e) {
      e.preventDefault();

      const nameInput = form.querySelector("[name='name']");
      const emailInput = form.querySelector("[name='email']");
      const phoneInput = form.querySelector("[name='phone']");
      const messageInput = form.querySelector("[name='message']");

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const phone = phoneInput.value.trim();
      const message = messageInput.value.trim();

      statusBox.hidden = false;
      statusBox.style.backgroundColor = "#f8faf6";

      if (!name || !email || !phone || !message) {
        statusBox.style.color = "#b9472e";
        statusBox.style.backgroundColor = "#fff1ef";
        statusBox.innerText = "❌ Please fill in all fields.";
        return;
      }

      const emailPattern = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
      if (!emailPattern.test(email)) {
        statusBox.style.color = "#b9472e";
        statusBox.style.backgroundColor = "#fff1ef";
        statusBox.innerText = "❌ Please enter a valid email address.";
        return;
      }

      const phoneDigits = phone.replace(/\D/g, '');
      if (phoneDigits.length < 8) {
        statusBox.style.color = "#b9472e";
        statusBox.style.backgroundColor = "#fff1ef";
        statusBox.innerText = "❌ Please enter a valid phone number (at least 8 digits).";
        return;
      }

      let formData = new FormData(form);
      sendBtn.disabled = true;
      sendBtn.innerText = "Sending...";

      try {
        let response = await fetch(form.action, {
          method: "POST",
          body: formData
        });

        let data;
        try {
          data = await response.json();
        } catch (err) {
          if (response.ok) {
            data = { status: "success", message: "✓ Message sent successfully! We'll get back soon." };
          } else {
            data = { status: "error", message: "⚠️ Server error. Please try later." };
          }
        }

        statusBox.hidden = false;
        statusBox.style.backgroundColor = "#f0f8ea";
        if (data.status === "success") {
          statusBox.style.color = "#1f7a3b";
          statusBox.innerText = data.message || "✓ Your message has been sent. Thank you!";
          form.reset();
          setTimeout(() => {
            if (statusBox.innerText.includes("Thank you") || statusBox.innerText.includes("successfully")) {
              setTimeout(() => {
                if (statusBox && !statusBox.innerText.includes("error")) {
                  statusBox.hidden = true;
                }
              }, 3000);
            }
          }, 3500);
        } else {
          statusBox.style.color = "#c23b1e";
          statusBox.style.backgroundColor = "#feeceb";
          statusBox.innerText = data.message || "⚠️ Submission failed. Please try again.";
        }
      } catch (error) {
        statusBox.hidden = false;
        statusBox.style.color = "#c0392b";
        statusBox.style.backgroundColor = "#feeceb";
        statusBox.innerText = "⚠️ Network error. Please check your connection and try again.";
        console.error("Form fetch error:", error);
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "SEND MESSAGE";
      }
    }

    form.addEventListener("submit", handleSubmit);
  })();
</script>
